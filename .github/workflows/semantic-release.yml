name: Semantic Release

on:
  push:
    branches:
    - main
    - master
    - next
    - beta
    - alpha
    paths:
    - src/**
    - package*.json
    - .releaserc*
    - release.config.js
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # ratchet:actions/setup-node@v6.4.0
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: |
        npm install -g \
          semantic-release \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          @semantic-release/npm \
          @semantic-release/exec \
          conventional-changelog-conventionalcommits

    - name: Verify configuration
      run: |
        if [ ! -f .releaserc.json ] && [ ! -f .releaserc.yml ] && [ ! -f release.config.js ]; then
          echo "No semantic-release config found, using default"
        fi

    - name: Release
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: npx semantic-release

  # Alternative: Python semantic release
  python-release:
    name: Python Semantic Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check prerequisites
      id: check
      run: |
        if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Python
      if: steps.check.outputs.should_run == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # ratchet:actions/setup-python@v6.3.0
      with:
        python-version: '3.11'

    - name: Install python-semantic-release
      if: steps.check.outputs.should_run == 'true'
      run: |
        pip install python-semantic-release

    - name: Python Semantic Release
      if: steps.check.outputs.should_run == 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        semantic-release publish

  # Go semantic release
  go-release:
    name: Go Semantic Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - name: Check prerequisites
      id: check
      run: |
        if [ -f "go.mod" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Go
      if: steps.check.outputs.should_run == 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # ratchet:actions/setup-go@v6.5.0
      with:
        go-version: stable

    - name: Run GoReleaser
      if: steps.check.outputs.should_run == 'true'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # ratchet:goreleaser/goreleaser-action@v7.2.3
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container image release
  container-release:
    name: Container Image Release
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Check for Dockerfile
      id: check
      run: |
        if [ -f "Dockerfile" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi

    - name: Docker meta
      if: steps.check.outputs.should_run == 'true'
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # ratchet:docker/metadata-action@v6.1.0
      with:
        images: |
          ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Set up Docker Buildx
      if: steps.check.outputs.should_run == 'true'
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # ratchet:docker/setup-buildx-action@v4.1.0
    - name: Login to GHCR
      if: steps.check.outputs.should_run == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # ratchet:docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      if: steps.check.outputs.should_run == 'true'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # ratchet:docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install Trivy
      if: steps.check.outputs.should_run == 'true'
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1

    - name: Scan container image for vulnerabilities
      if: steps.check.outputs.should_run == 'true'
      run: |
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
        trivy image --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH "$IMAGE_TAG" || true

    - name: Upload Trivy scan results
      if: steps.check.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: trivy-container-scan
        path: trivy-results.sarif
        retention-days: 30
