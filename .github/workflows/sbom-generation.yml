name: SBOM Generation

on:
  push:
    branches: [main, master]
    paths:
    - requirements*.txt
    - package*.json
    - go.mod
    - Cargo.toml
    - pom.xml
    - build.gradle
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # ratchet:anchore/sbom-action@v0
      with:
        format: spdx-json
        output-file: sbom.spdx.json
        upload-artifact: true
        upload-release-assets: true

    - name: Generate SBOM (CycloneDX format)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # ratchet:anchore/sbom-action@v0
      with:
        format: cyclonedx-json
        output-file: sbom.cyclonedx.json
        upload-artifact: true

    - name: Upload SBOM to dependency graph
      uses: advanced-security/spdx-dependency-submission-action@169d22427d74f3faf93504e70b03eede8dab272a  # ratchet:advanced-security/spdx-dependency-submission-action@v0.2.0
      with:
        filePath: sbom.spdx.json

    - name: Archive SBOM artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: sbom-reports
        path: |
          sbom.*.json
        retention-days: 90
