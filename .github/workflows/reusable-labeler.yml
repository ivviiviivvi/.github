# Reusable workflow for pull request labeling
# Can be called from other repositories using workflow_call
name: 'Reusable: Pull Request Labeler'

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: .github/labeler.yml
        description: Path to the labeler configuration file
      sync-labels:
        required: false
        type: boolean
        default: true
        description: Whether to sync labels (remove labels that no longer match)
    secrets:
      github-token:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    name: Label Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Run Labeler
      uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213   # v6.1.0
      with:
        repo-token: ${{ secrets.github-token }}
        configuration-path: ${{ inputs.config-path }}
        sync-labels: ${{ inputs.sync-labels }}
