# Reusable workflow for pull request labeling
# Can be called from other repositories using workflow_call
name: 'Reusable: Pull Request Labeler'

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: .github/labeler.yml
        description: Path to the labeler configuration file
      sync-labels:
        required: false
        type: boolean
        default: true
        description: Whether to sync labels (remove labels that no longer match)
    secrets:
      github-token:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    name: Label Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Run Labeler
      uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d   # v6.2.0
      with:
        repo-token: ${{ secrets.github-token }}
        configuration-path: ${{ inputs.config-path }}
        sync-labels: ${{ inputs.sync-labels }}
