name: Manual Reset

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # ratchet:actions/setup-python@v5.3.0
      with:
        python-version: '3.12'
        cache: pip

    - name: Make scripts executable
      run: chmod +x src/automation/scripts/*.sh

        # Removed manage_lock.sh usage to prevent deadlock and reliance on deprecated locking mechanism
        # quota_manager.py handles locking internally using fcntl

    - name: Reset quotas
      run: python src/automation/scripts/quota_manager.py reset_quotas

    - name: Commit state changes
      run: |
        ./src/automation/scripts/commit_changes.sh "chore: manually reset quotas"
