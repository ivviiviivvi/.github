name: Collect Metrics

on:
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0    # ratchet:actions/checkout@v7.0.0

    - name: Collect workflow metrics
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3    # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          const runs = await github.rest.actions.listWorkflowRunsForRepo({owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          const metrics = {total_runs: runs.data.total_count,
            success_count: runs.data.workflow_runs.filter(
              r => r.conclusion === 'success'
            ).length,
            failure_count: runs.data.workflow_runs.filter(
              r => r.conclusion === 'failure'
            ).length
          };

          console.log(JSON.stringify(metrics, null, 2));

    - name: Notify Slack on Failure
      if: failure()
      uses: ./.github/actions/slack-notify
      with:
        webhook-url: ${ secrets.SLACK_WEBHOOK_ALERTS }
        priority: P3
        title: Metrics Collection Failed
        message: The metrics collection workflow failed.
        workflow: collect-metrics
        status: failure
