name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]
    paths:
    - '**/package*.json'
    - '**/yarn.lock'
    - '**/pnpm-lock.yaml'
    - '**/requirements*.txt'
    - '**/Pipfile*'
    - '**/go.mod'
    - '**/go.sum'
    - '**/Gemfile*'
    - '**/composer.json'
    - '**/composer.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # ratchet:actions/dependency-review-action@v4
      with:
          # Fail the action if vulnerabilities are found
        fail-on-severity: moderate
          # Allow licenses (customize as needed)
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          # Comment on PR with results
        comment-summary-in-pr: always
