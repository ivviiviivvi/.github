# PR Title validation for this repository
# Enforces conventional commit format in PR titles
name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Validate Semantic PR Title
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # ratchet:amannn/action-semantic-pull-request@v6.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          # Standard conventional commit types
        types: |
          build
          chore
          ci
          docs
          feat
          fix
          perf
          refactor
          revert
          style
          test
        # Scopes are optional and unrestricted (any scope is accepted)
        requireScope: false
