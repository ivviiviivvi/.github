name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
    - src/automation/scripts/utils/**
    - requirements*.txt
    - .github/workflows/ci.yml
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v6.2.0
      with:
        python-version: '3.12'
        cache: pip

    - name: Install pre-commit
      run: |
        pip install pre-commit

    - name: Cache pre-commit hooks
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # ratchet:actions/cache@v5.0.4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-${{ runner.os }}-

    - name: Run pre-commit hooks
      env:
        SKIP: mypy,bandit,detect-secrets,resolve-managed-links,no-commit-to-branch,eslint,python-safety-dependencies-check
      run: |
        pre-commit run --all-files --show-diff-on-failure

    - name: Lint summary
      if: always()
      run: |
        echo "### 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Linting checks completed" >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v5.3.0
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        if command -v pytest &> /dev/null; then
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=junit.xml -v
        else
          echo "No tests configured"
        fi

    - name: Upload coverage to Codecov
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # ratchet:codecov/codecov-action@v6.0.0
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      if: always() && hashFiles('junit.xml') != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # ratchet:actions/upload-artifact@v7.0.0
      with:
        name: test-results-python-3.12
        path: |
          junit.xml
          htmlcov/
          coverage.xml
        retention-days: 30

    - name: Test summary
      if: always()
      run: |
        echo "### 🧪 Test Results (Python 3.12)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed for Python 3.12" >> $GITHUB_STEP_SUMMARY

  build-and-test-node:
    name: Build and Test (Node.js)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Check for package.json
      id: check-package
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "No package.json found, skipping Node.js build"
        fi

    - name: Set up Node.js
      if: steps.check-package.outputs.exists == 'true'
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # ratchet:actions/setup-node@v6.3.0
      with:
        node-version: '20'
        cache: npm

    - name: Install dependencies
      if: steps.check-package.outputs.exists == 'true'
      run: npm ci

    - name: Run tests
      if: steps.check-package.outputs.exists == 'true'
      run: npm test -- --run || true

    - name: Build project
      if: steps.check-package.outputs.exists == 'true'
      run: npm run build || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Dependency Review
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # ratchet:actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        deny-licenses: GPL-3.0, AGPL-3.0

    - name: Security summary
      if: always()
      run: |
        # Install dependencies before running tests
        pip install -e ".[dev]" 2>/dev/null || true
        # Run unit tests in scripts/utils directory
        cd src/automation/scripts/utils && python3 -m unittest discover -p "test_*.py" || true

  ci-status-check:
    name: CI Status Check
    needs: [lint, test, build-and-test-node, security]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Check job results
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Test: ${{ needs.test.result }}"
        echo "Build and Test Node: ${{ needs.build-and-test-node.result }}"
        echo "Security: ${{ needs.security.result }}"

        if [[ "${{ needs.lint.result }}" == "failure" || \
              "${{ needs.test.result }}" == "failure" || \
              "${{ needs.build-and-test-node.result }}" == "failure" || \
              "${{ needs.security.result }}" == "failure" ]]; then
          echo "::error::One or more CI jobs failed"
          exit 1
        fi

        echo "All CI jobs passed or were skipped"
