name: Community Health

on:
  schedule:
    # Run weekly on Sundays at 9:00 AM UTC
  - cron: 0 9 * * 0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale-management:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Close Stale Issues and PRs
      uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899  # ratchet:actions/stale@v10.3.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issues
        stale-issue-message: |
          👋 This issue has been automatically marked as stale because it has not had recent activity.

          It will be closed in 7 days if no further activity occurs.

          If you believe this issue is still relevant, please:
          - Add a comment explaining why it should remain open
          - Remove the 'stale' label
          - Add new information or updates

          Thank you for your contributions!
        close-issue-message: |
          This issue has been automatically closed due to inactivity.

          If you believe this issue should be reopened, please create a new issue with:
          - Reference to this closed issue
          - Updated information or context
          - Why it's still relevant

          Thank you for your understanding!
        days-before-issue-stale: 60
        days-before-issue-close: 7
        stale-issue-label: stale
        exempt-issue-labels: pinned,security,roadmap,epic,planned

          # Pull Requests
        stale-pr-message: |
          👋 This pull request has been automatically marked as stale because it has not had recent activity.

          It will be closed in 7 days if no further activity occurs.

          If you're still working on this:
          - Add a comment with an update
          - Push new commits
          - Request a review
          - Remove the 'stale' label

          Thank you for your contribution!
        close-pr-message: |
          This pull request has been automatically closed due to inactivity.

          If you'd like to continue this work:
          - Reopen the PR if you have write access
          - Create a new PR with updated changes
          - Reference this PR in the new one

          Thank you for your contribution!
        days-before-pr-stale: 30
        days-before-pr-close: 7
        stale-pr-label: stale
        exempt-pr-labels: pinned,security,work-in-progress,blocked

          # General settings
        operations-per-run: 100
        remove-stale-when-updated: true
        ascending: true

  lock-closed-issues:
    name: Lock Closed Issues
    runs-on: ubuntu-latest
    steps:
    - name: Lock Inactive Closed Issues
      uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c  # ratchet:dessant/lock-threads@v6.0.2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        issue-inactive-days: 90
        issue-comment: |
          This issue has been automatically locked because it has been closed for more than 90 days.

          If you have a related problem, please open a new issue and reference this one.

          Thank you!
        pr-inactive-days: 90
        pr-comment: |
          This pull request has been automatically locked because it has been closed for more than 90 days.

          If you have a related issue, please open a new PR or issue.

          Thank you!

  update-contributors:
    name: Update Contributors List
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Contributors List
      continue-on-error: true
      uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f  # ratchet:akhilmhdh/contributors-readme-action@v2.3.11
      with:
        image_size: 80
        columns_per_row: 7
        readme_path: CONTRIBUTORS.md
        committer_username: github-actions[bot]
        committer_email: github-actions[bot]@users.noreply.github.com
        commit_message: 'docs: update contributors list'

  issue-metrics:
    name: Generate Issue Metrics
    runs-on: ubuntu-latest
    steps:
    - name: Get Issue Metrics
      uses: github/issue-metrics@44173f9e0a3b2144a777a10a340e4c09a25ac9f8  # ratchet:github/issue-metrics@v4.2.8
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SEARCH_QUERY: repo:${{ github.repository }} is:issue created:>=${{ github.event.repository.created_at }}

    - name: Upload Metrics
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: issue-metrics
        path: issue_metrics.md
        retention-days: 90
