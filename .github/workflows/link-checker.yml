name: Link Checker

on:
  push:
    branches: [main, master]
    paths:
    - '**.md'
    - '**.html'
  pull_request:
    paths:
    - '**.md'
    - '**.html'
  schedule:
    # Run weekly on Mondays at 8:00 AM UTC
  - cron: 0 8 * * 1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  link-checker:
    name: Check Links in Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Check for unresolved template variables
      id: check-template
      run: |
        if grep -rq '{{[A-Z_]*}}' README.md 2>/dev/null; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "::warning::Template variables detected — skipping link check until setup_template.py is run"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Check Links
      if: steps.check-template.outputs.skip != 'true'
      uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # ratchet:lycheeverse/lychee-action@v2.8.0
      with:
          # Check all markdown and html files
        args: |
          --verbose
          --no-progress
          --exclude 'linkedin.com'
          --exclude 'twitter.com'
          --exclude 'x.com'
          --exclude 'localhost'
          --exclude 'github\.com/marketplace'
          --exclude 'github\.com/.*/settings/'
          --exclude 'allcontributors\.org'
          --exclude 'gh\.io/'
          --exclude 'docs\.github\.com'
          --exclude-path 'src/automation/project_meta/reports/'
          --exclude-path 'docs/analysis/'
          --exclude-path 'docs/archive/'
          --exclude-path 'docs/_includes/'
          --exclude-path 'docs/_layouts/'
          --exclude-path 'docs/site/'
          --exclude-path 'src/automation/dashboard/'
          --exclude-path 'src/ai_framework/collections/'
          --exclude-path 'docs/ai_framework/collections/'
          --exclude-path 'docs/templates/'
          --exclude-path 'docs/standards/'
          --exclude-path 'docs/status/'
          --exclude-path '.devcontainer/'
          --exclude-path 'CONTRIBUTING.md'
          --exclude-path 'SUPPORT.md'
          --max-retries 3
          --timeout 20
          '**/*.md'
          '**/*.html'
         # Fail action on broken links
        fail: true
            # Output format
        format: markdown
            # Output file
        output: link-checker-report.md

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: link-checker-report
        path: link-checker-report.md
        retention-days: 30

    - name: Comment on PR
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          const fs = require('fs');
          let report = 'Broken links detected!';

          if (fs.existsSync('link-checker-report.md')) {
            report = fs.readFileSync('link-checker-report.md', 'utf8');
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `## 🔗 Broken Links Detected\n\n${report}\n\nPlease fix the broken links before merging.`
          });

    - name: Create Issue for Broken Links
      if: failure() && github.event_name == 'schedule'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          const fs = require('fs');
          let report = 'Broken links detected in scheduled check.';

          if (fs.existsSync('link-checker-report.md')) {
            report = fs.readFileSync('link-checker-report.md', 'utf8');
          }

          // Check if an issue already exists
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'broken-links'
          });

          if (issues.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Broken Links Detected in Documentation',
              body: `## Broken Links Report\n\nAutomated link checker found broken links in the documentation.\n\n${report}\n\n**Action Required:**\n- Review and fix broken links\n- Update or remove outdated references\n- Close this issue once all links are fixed`,
              labels: ['documentation', 'broken-links', 'automated']
            });
          }

  managed-links:
    name: Validate Managed Links
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v6.2.0
      with:
        python-version: ${{ vars.PYTHON_VERSION_DEFAULT || '3.12' }}

    - name: Install PyYAML
      run: pip install PyYAML

    - name: Validate managed links
      run: python src/automation/scripts/resolve_link_placeholders.py --check
      continue-on-error: true

    - name: Report managed link status
      if: failure()
      run: |
        echo "::warning::Managed links need updating. Run: python src/automation/scripts/resolve_link_placeholders.py --write"

  markdown-link-check:
    name: Check Markdown Links
    if: vars.ENABLE_MARKDOWN_LINK_CHECKS == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Check Markdown Links
      uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # ratchet:gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: no
        use-verbose-mode: yes
        config-file: .github/markdown-link-check-config.json
        folder-path: .
        file-path: ./README.md
        max-depth: -1
        check-modified-files-only: no

  spell-check:
    name: Spell Check Documentation
    if: vars.ENABLE_SPELL_CHECK == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Run Spell Check
      uses: rojopolis/spellcheck-github-actions@e3cd8e9aec4587ec73bc0e60745aafd45c37aa2e   # 0.60.0
      with:
        config_path: .github/spellcheck-config.yml
        task_name: Markdown
