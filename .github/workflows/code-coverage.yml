name: Code Coverage

on:
  push:
    branches: [main, master, develop]
    paths:
    - src/**
    - tests/**
    - requirements*.txt
    - package*.json
    - setup.py
    - pyproject.toml
  pull_request:
    branches: [main, master, develop]
    paths:
    - src/**
    - tests/**
    - requirements*.txt
    - package*.json
    - setup.py
    - pyproject.toml
  schedule:
  - cron: 0 0 * * 0   # Weekly on Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - name: Set up Python
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v5.3.0
      with:
        python-version: '3.11'
        cache: pip

    - name: Set up Node.js
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # ratchet:actions/setup-node@v6.4.0
      with:
        node-version: '20'
        cache: npm

    - name: Install Python dependencies
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Node dependencies
      if: hashFiles('package.json') != ''
      run: npm ci

    - name: Run Python tests with coverage
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=0

    - name: Run JavaScript tests with coverage
      if: hashFiles('package.json') != ''
      run: |
        npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # ratchet:codecov/codecov-action@v7.0.0
      with:
        files: ./coverage.xml,./coverage/lcov.info
        flags: unittests
        name: coverage-report
        fail_ci_if_error: false
        verbose: true

    - name: Coverage report comment
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79  # ratchet:py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60

    - name: Upload coverage reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
          coverage/
        retention-days: 30

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests and check coverage
      run: |
        pytest --cov=. --cov-fail-under=0 --cov-report=term-missing

    - name: Coverage gate
      if: failure()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          if (context.eventName === 'pull_request') {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Coverage Check Failed\n\nThe code coverage is below the required threshold of 70%.\n\nPlease add tests to improve coverage before merging.`
            });
          }
