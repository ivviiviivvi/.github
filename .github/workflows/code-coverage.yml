name: Code Coverage

on:
  push:
    branches: [main, master, develop]
    paths:
    - src/**
    - tests/**
    - requirements*.txt
    - package*.json
    - setup.py
    - pyproject.toml
  pull_request:
    branches: [main, master, develop]
    paths:
    - src/**
    - tests/**
    - requirements*.txt
    - package*.json
    - setup.py
    - pyproject.toml
  schedule:
  - cron: 0 0 * * 0   # Weekly on Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Python
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v5.3.0
      with:
        python-version: '3.11'
        cache: pip

    - name: Set up Node.js
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # ratchet:actions/setup-node@v6.3.0
      with:
        node-version: '20'
        cache: npm

    - name: Install Python dependencies
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Node dependencies
      if: hashFiles('package.json') != ''
      run: npm ci

    - name: Run Python tests with coverage
      if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml') != ''
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=0

    - name: Run JavaScript tests with coverage
      if: hashFiles('package.json') != ''
      run: |
        npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad  # ratchet:codecov/codecov-action@v5.5.3
      with:
        files: ./coverage.xml,./coverage/lcov.info
        flags: unittests
        name: coverage-report
        fail_ci_if_error: false
        verbose: true

    - name: Coverage report comment
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@7188638f871f721a365d644f505d1ff3df20d683  # ratchet:py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60

    - name: Upload coverage reports
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # ratchet:actions/upload-artifact@v7.0.0
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
          coverage/
        retention-days: 30

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests and check coverage
      run: |
        pytest --cov=. --cov-fail-under=0 --cov-report=term-missing

    - name: Coverage gate
      if: failure()
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # ratchet:actions/github-script@v8.0.0
      with:
        script: |
          if (context.eventName === 'pull_request') {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Coverage Check Failed\n\nThe code coverage is below the required threshold of 70%.\n\nPlease add tests to improve coverage before merging.`
            });
          }
