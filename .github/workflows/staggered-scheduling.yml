name: Staggered Scheduling for Batch Operations

on:
  schedule:
    # Run scheduler daily at midnight UTC to plan the week
  - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      force_reschedule:
        description: Force rescheduling of all repositories
        required: false
        type: boolean
        default: false
      repositories_per_day:
        description: Maximum repositories per day
        required: false
        type: number
        default: 10

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  SCHEDULE_FILE: .github/scheduling/schedule.json
  REPOS_PER_DAY: 10
  MAX_CONCURRENT_WORKFLOWS: 3

jobs:
  calculate-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Calculate Staggered Schedule
    outputs:
      has_schedule: ${{ steps.generate.outputs.has_schedule }}
      repos_today: ${{ steps.check-today.outputs.repos_today }}
      schedule_date: ${{ steps.check-today.outputs.schedule_date }}
      stagger_minutes: ${{ steps.check-today.outputs.stagger_minutes }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # ratchet:actions/setup-python@v6.3.0
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        pip install PyGithub pyyaml

    - name: Fetch organization repositories
      id: fetch-repos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
      run: |
        cat > fetch_repos.py << 'EOF'
        import os
        import json
        from github import Github

        g = Github(os.environ['GITHUB_TOKEN'])
        org = g.get_organization(os.environ['GITHUB_ORG'])

        repos = []
        for repo in org.get_repos():
            if not repo.archived and not repo.fork:
                repos.append({
                    'name': repo.name,
                    'full_name': repo.full_name,
                    'size': repo.size,
                    'language': repo.language,
                    'updated_at': repo.updated_at.isoformat(),
                    'has_pages': repo.has_pages,
                    'default_branch': repo.default_branch
                })

        with open('repositories.json', 'w') as f:
            json.dump(repos, f, indent=2)

        print(f"Found {len(repos)} active repositories")
        EOF

        python fetch_repos.py

        REPO_COUNT=$(jq 'length' repositories.json)
        echo "repo_count=$REPO_COUNT" >> $GITHUB_OUTPUT

    - name: Plan staggered schedule
      id: generate
      env:
        REPOSITORIES_PER_DAY: ${{ github.event.inputs.repositories_per_day || env.REPOS_PER_DAY }}
        FORCE_RESCHEDULE: ${{ github.event.inputs.force_reschedule || 'false' }}
      run: |
        TODAY=$(date -u +%Y-%m-%d)

        python src/automation/scripts/staggered_walkthrough_schedule.py plan \
          --repositories repositories.json \
          --schedule-file "${{ env.SCHEDULE_FILE }}" \
          --output schedule.json \
          --repos-per-day "$REPOSITORIES_PER_DAY" \
          --force "$FORCE_RESCHEDULE" \
          --today "$TODAY"

    - name: Save schedule
      run: |
        mkdir -p "$(dirname "${{ env.SCHEDULE_FILE }}")"
        mv schedule.json "${{ env.SCHEDULE_FILE }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ env.SCHEDULE_FILE }}"

        if git diff --staged --quiet; then
          echo "No schedule changes to commit"
        else
          git commit -m "chore: update staggered schedule [skip ci]"
          git push
        fi

    - name: Check today's schedule
      id: check-today
      run: |
        if [ ! -f "${{ env.SCHEDULE_FILE }}" ]; then
          echo "repos_today=0" >> $GITHUB_OUTPUT
          echo "schedule_date=" >> $GITHUB_OUTPUT
          echo "stagger_minutes=5" >> $GITHUB_OUTPUT
          exit 0
        fi

        python src/automation/scripts/staggered_walkthrough_schedule.py due \
          --schedule-file "${{ env.SCHEDULE_FILE }}" \
          --repos-output repos_today.txt \
          --today "$(date -u +%Y-%m-%d)"

        REPOS_TODAY=$(wc -l < repos_today.txt | tr -d ' ')
        if [ "$REPOS_TODAY" -gt 0 ]; then
          echo "📋 Today's schedule: $REPOS_TODAY repositories"
          cat repos_today.txt
        else
          echo "✅ No repositories scheduled for today"
        fi

    - name: Upload today's schedule
      if: steps.check-today.outputs.repos_today != '0'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: todays-schedule
        path: repos_today.txt
        retention-days: 1

  execute-today-schedule:
    needs: calculate-schedule
    if: needs.calculate-schedule.outputs.repos_today != '0'
    runs-on: ubuntu-latest
    name: Execute Today's Scheduled Workflows

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 1
        ref: ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download today's schedule
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # ratchet:actions/download-artifact@v8.0.1
      with:
        name: todays-schedule

    - name: Execute staggered workflows
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        STAGGER_MINUTES: ${{ needs.calculate-schedule.outputs.stagger_minutes || '5' }}
        MAX_CONCURRENT: ${{ env.MAX_CONCURRENT_WORKFLOWS }}
      run: |
        cat > execute_schedule.sh << 'EOF'
        #!/bin/bash

        CURRENT_RUNNING=0

        echo "🚀 Starting staggered workflow execution..."

        while IFS= read -r repo; do
          # Check current running workflows
          RUNNING=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/actions/runs?status=in_progress" | \
            jq '.workflow_runs | length')

          CURRENT_RUNNING=$RUNNING

          # Wait if too many concurrent workflows
          while [ "$CURRENT_RUNNING" -ge "$MAX_CONCURRENT" ]; do
            echo "⏳ Waiting... ($CURRENT_RUNNING workflows running)"
            sleep 30
            RUNNING=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$repo/actions/runs?status=in_progress" | \
              jq '.workflow_runs | length')
            CURRENT_RUNNING=$RUNNING
          done

          echo "📋 Triggering workflow for: $repo"

          REPO_JSON=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo" || echo '{}')
          DEFAULT_BRANCH=$(echo "$REPO_JSON" | jq -r '.default_branch // "main"')
          PAYLOAD=$(jq -n --arg ref "$DEFAULT_BRANCH" '{ref: $ref}')

          if curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/actions/workflows/generate-walkthrough.yml/dispatches" \
            -d "$PAYLOAD"; then
            echo "✅ Triggered: $repo ($DEFAULT_BRANCH)"
          else
            echo "⚠️ Failed to trigger workflow for $repo"
          fi

          echo "⏰ Waiting $STAGGER_MINUTES minutes before next..."
          sleep $((STAGGER_MINUTES * 60))

        done < repos_today.txt

        echo "✅ All scheduled workflows triggered"
        EOF

        chmod +x execute_schedule.sh
        bash execute_schedule.sh

    - name: Update schedule status
      if: always()
      env:
        SCHEDULE_DATE: ${{ needs.calculate-schedule.outputs.schedule_date }}
      run: |
        if [ -z "$SCHEDULE_DATE" ]; then
          echo "No schedule date was executed; skipping status update"
          exit 0
        fi

        if [ -f "${{ env.SCHEDULE_FILE }}" ]; then
          python src/automation/scripts/staggered_walkthrough_schedule.py complete \
            --schedule-file "${{ env.SCHEDULE_FILE }}" \
            --date "$SCHEDULE_DATE" \
            --completed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.SCHEDULE_FILE }}
          git commit -m "chore: mark $SCHEDULE_DATE schedule as completed [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
        fi

  monitor-quota:
    runs-on: ubuntu-latest
    name: Monitor GitHub Actions Quota
    needs: execute-today-schedule
    if: always()

    steps:
    - name: Check quota usage
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BILLING=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/orgs/${{ github.repository_owner }}/settings/billing/actions")

        TOTAL_MINUTES_USED=$(echo "$BILLING" | jq '.total_minutes_used')
        INCLUDED_MINUTES=$(echo "$BILLING" | jq '.included_minutes')
        TOTAL_PAID_MINUTES=$(echo "$BILLING" | jq '.total_paid_minutes_used')

        PERCENTAGE_USED=$(echo "scale=2; ($TOTAL_MINUTES_USED / $INCLUDED_MINUTES) * 100" | bc)

        echo "📊 GitHub Actions Quota Status:"
        echo "  Total minutes used: $TOTAL_MINUTES_USED"
        echo "  Included minutes: $INCLUDED_MINUTES"
        echo "  Percentage used: $PERCENTAGE_USED%"
        echo "  Paid minutes used: $TOTAL_PAID_MINUTES"

        # Alert if usage is high
        if (( $(echo "$PERCENTAGE_USED > 80" | bc -l) )); then
          echo "⚠️ WARNING: GitHub Actions quota usage is above 80%!"
          echo "quota_warning=true" >> $GITHUB_ENV
        else
          echo "✅ Quota usage is within acceptable range"
          echo "quota_warning=false" >> $GITHUB_ENV
        fi

    - name: Create alert if quota high
      if: env.quota_warning == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '⚠️ GitHub Actions Quota Alert - Usage Above 80%',
            body: `## GitHub Actions Quota Warning

            The organization's GitHub Actions minutes usage has exceeded 80% of the monthly quota.

            ### Current Status

            - **Usage**: Above 80%
            - **Date**: ${new Date().toISOString()}

            ### Action Required

            1. Review the staggered scheduling configuration
            2. Consider reducing \`repos_per_day\` value
            3. Increase stagger time between workflows
            4. Review and optimize workflow efficiency
            5. Consider upgrading to a higher quota plan

            ### Automatic Actions Taken

            - Staggered scheduling will continue with current settings
            - Monitor usage closely over the next few days

            **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `,
            labels: ['alert', 'quota', 'actions']
          });

  generate-report:
    runs-on: ubuntu-latest
    name: Generate Scheduling Report
    needs: [calculate-schedule, execute-today-schedule]
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0
    - name: Generate report
      run: |
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## 📅 Staggered Scheduling Report

        ### Today's Execution
        - **Repositories Scheduled**: ${{ needs.calculate-schedule.outputs.repos_today }}
        - **Status**: ${{ needs.execute-today-schedule.result || 'Not executed' }}

        ### Schedule Overview

        The staggered scheduling system distributes repository workflows across multiple days to:
        - Prevent GitHub Actions quota exhaustion
        - Avoid rate limiting
        - Ensure stable, reliable execution
        - Distribute load evenly

        ### Configuration
        - **Repositories per Day**: ${{ env.REPOS_PER_DAY }}
        - **Stagger Time**: 5 minutes between repos
        - **Max Concurrent**: ${{ env.MAX_CONCURRENT_WORKFLOWS }} workflows

        ### Benefits
        - ✅ No quota exhaustion
        - ✅ Predictable execution schedule
        - ✅ Even load distribution
        - ✅ Automatic recovery from failures

        ---

        📊 View full schedule: `.github/scheduling/schedule.json`
        EOF
