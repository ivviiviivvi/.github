name: Deploy Jekyll site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # ratchet:actions/checkout@v4

    - name: Check for Jekyll site
      id: check
      run: |
        if [ -f "site/Gemfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Ruby
      if: steps.check.outputs.exists == 'true'
      uses: ruby/setup-ruby@b8d447ba7506ac7e0c8fbc50762276fb3b7df731  # ratchet:ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        working-directory: site

    - name: Setup Pages
      if: steps.check.outputs.exists == 'true'
      id: pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # ratchet:actions/configure-pages@v5

    - name: Build with Jekyll
      if: steps.check.outputs.exists == 'true'
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      working-directory: site
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      if: steps.check.outputs.exists == 'true'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # ratchet:actions/upload-pages-artifact@v3
      with:
        path: site/_site

  deploy:
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # ratchet:actions/deploy-pages@v4
