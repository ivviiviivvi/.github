name: Deploy Jekyll site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # ratchet:actions/checkout@v6.0.2

    - name: Check for Jekyll site
      id: check
      run: |
        if [ -f "site/Gemfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Ruby
      if: steps.check.outputs.exists == 'true'
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # ratchet:ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        working-directory: site

    - name: Setup Pages
      if: steps.check.outputs.exists == 'true'
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # ratchet:actions/configure-pages@v6.0.0

    - name: Build with Jekyll
      if: steps.check.outputs.exists == 'true'
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      working-directory: site
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      if: steps.check.outputs.exists == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # ratchet:actions/upload-pages-artifact@v5.0.0
      with:
        path: site/_site

  deploy:
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # ratchet:actions/deploy-pages@v5.0.0
