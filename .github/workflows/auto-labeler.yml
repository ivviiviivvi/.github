name: Auto Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-pr:
    name: Label Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # ratchet:actions/checkout@v7.0.0

    - name: Run Labeler
      uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213  # ratchet:actions/labeler@v6.1.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler.yml
        sync-labels: true

  label-size:
    name: Label PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
    - name: Label PR Size
      uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9  # ratchet:codelytv/pr-size-labeler@v1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        xs_label: size/xs
        xs_max_size: 10
        s_label: size/s
        s_max_size: 100
        m_label: size/m
        m_max_size: 500
        l_label: size/l
        l_max_size: 1000
        xl_label: size/xl
        fail_if_xl: false
        message_if_xl: This PR is very large. Consider breaking it into smaller PRs for easier review.
        files_to_ignore: package-lock.json,yarn.lock,pnpm-lock.yaml,*.min.js,*.min.css

  auto-label-issues:
    name: Auto Label Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
    - name: Check for Bug Keywords
      if: contains(github.event.issue.body, 'bug') || contains(github.event.issue.title, 'bug') || contains(github.event.issue.body, 'error') || contains(github.event.issue.title, 'error')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['bug']
          })

    - name: Check for Feature Keywords
      if: contains(github.event.issue.body, 'feature') || contains(github.event.issue.title, 'feature') || contains(github.event.issue.body, 'enhancement') || contains(github.event.issue.title, 'enhancement')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['enhancement']
          })

    - name: Check for Documentation Keywords
      if: contains(github.event.issue.body, 'documentation') || contains(github.event.issue.title, 'documentation') || contains(github.event.issue.body, 'docs') || contains(github.event.issue.title, 'docs')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['documentation']
          })

    - name: Check for Question Keywords
      if: contains(github.event.issue.body, 'question') || contains(github.event.issue.title, 'question') || contains(github.event.issue.body, 'help') || contains(github.event.issue.title, 'help')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['question']
          })
